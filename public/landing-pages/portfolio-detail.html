<script>
const PAGES={
resume:{eyebrow:'01 · PROFILE',title:'个人简历',deck:'从互联网平台、电商到游戏与 AI 团队，持续围绕业务需要推进人才交付、行业研究与招聘效率建设。',content:`
<section class="section" data-reveal><p class="section-kicker">CAREER SNAPSHOT</p><h2>招聘工作概览</h2><div class="metric-grid"><div class="metric"><strong>170+</strong><span>公开履历中的累计 Offer</span></div><div class="metric"><strong>5</strong><span>段互联网与游戏招聘经历</span></div><div class="metric"><strong>4</strong><span>互联网、电商、游戏、AI 赛道</span></div></div></section>
<section class="section" data-reveal><p class="section-kicker">EXPERIENCE</p><h2>工作经历</h2><div class="timeline">
<div class="job"><div class="job-time">2026.02—至今</div><div><h3>网易互娱 · 招聘经理</h3><p>负责游戏交互、AI 产品与设计、技术类岗位招聘，参与高阶岗位交付、行业 Mapping、薪酬体系与 AI 应用专项调研，并持续探索招聘提效工具。</p></div></div>
<div class="job"><div class="job-time">2024.12—2026.02</div><div><h3>阿里优酷 · 招聘 HR</h3><p>对接职能、综艺、运营、商业化、内容评估、影视工作室及游戏子公司等 50+ 岗位，自主开源产出 Offer 40+；参与雇主品牌内容与招聘数据运营。</p></div></div>
<div class="job"><div class="job-time">2024.07—2024.11</div><div><h3>拼多多 · HR 管培</h3><p>负责 TEMU 跨境电商业务全流程招聘，覆盖多条核心品类线，推进面试 130+、Offer 30+，并基于招聘漏斗持续优化交付过程。</p></div></div>
<div class="job"><div class="job-time">2023.10—2024.05</div><div><h3>网易雷火 · 美术招聘 HR 实习生</h3><p>服务逆水寒、永劫无间、代号无限大与 3A 单机等项目，负责资深美术及部分技术、策划岗位招聘，产出 P4-1 资深以上 Offer 5 人。</p></div></div>
<div class="job"><div class="job-time">2023.03—2023.09</div><div><h3>快手 · HR 实习生</h3><p>承接主站生产与社交业务线产品、运营、研发、设计岗位需求，任职期间完成社招 Offer 40+、校招 Offer 31、实习生 Offer 54。</p></div></div></div></section>
<section class="section" data-reveal><p class="section-kicker">EDUCATION</p><h2>教育与早期实践</h2><div class="copy"><p>北京联合大学国际商务本科，2024 年毕业。在校期间曾担任大学生管理决策模拟大赛与互联网+创新创业大赛队长并获奖。</p><p>大四休学期间在韩国尝试 3C 电子产品及配件采购与分销，累计盈利 10W+。</p></div></section>`},
about:{eyebrow:'02 · STORY',title:'关于我',deck:'一名互联网招聘从业者，也是一个愿意持续尝试、把想法真正做出来的人。',content:`
<section class="section portrait-row" data-reveal><div><p class="section-kicker">HELLO</p><h2>你好，我是王祥辉</h2><div class="copy"><p>2024 年本科毕业。2023 年起从事招聘工作，先后在快手、网易雷火、拼多多、阿里优酷和网易互娱任职，业务覆盖互联网、电商、游戏与 AI。</p><p>日常工作以社会招聘为主，既负责高阶及难点岗位攻坚，也承担基础岗位批量交付；同时参与过校招、暑期实习、线下宣讲、招聘运营与雇主品牌项目。</p></div></div><img class="portrait" src="inner-green-assets/wang-and-cat-transparent.png" alt="王祥辉和他的小猫"></section>
<section class="section" data-reveal><p class="section-kicker">OUTSIDE WORK</p><h2>工作之外</h2><div class="copy"><p>我持续探索 AI 在招聘场景中的实际应用，也借助 AI 完成了这个作品集的设计与搭建。</p><p>平时喜欢研究小型电子产品，也喜欢徒步、骑行和攀岩。愿意在不同领域持续尝试、磨练基本功，也期待接触更有挑战的内容，与优秀的人同行。</p></div></section>`},
ai:{eyebrow:'03 · LAB',title:'AI 应用',deck:'从招聘业务中的真实问题出发，把重复流程做成能够运行、验证和持续迭代的通用工具。',content:`
<section class="section" data-reveal><p class="section-kicker">ADVANTAGE</p><h2>我的核心竞争点</h2><div class="strength-grid"><div class="strength"><strong>理解招聘现场</strong><span>从寻访、筛选、交付和复盘中的真实阻塞点定义工具。</span></div><div class="strength"><strong>把流程做成产品</strong><span>不仅提出想法，也能完成原型、交互和可运行链路。</span></div><div class="strength"><strong>连接数据与 AI</strong><span>用结构化数据、规则与模型共同解决问题，而不是为 AI 而 AI。</span></div><div class="strength"><strong>保留人的判断</strong><span>工具负责整理、提醒和辅助分析，招聘决策仍由人完成。</span></div></div></section>
<section class="section" data-reveal><p class="section-kicker">SOCIAL RECRUITING</p><h2>社招工具实践</h2><div class="case-list">
<details class="case-card"><summary><span class="case-index">01</span><span class="case-heading"><strong>招聘寻访与人才运营工作台</strong><span>整合 BOSS 与脉脉日常寻访中的重复流程，沉淀外部人才与 Mapping 线索。</span></span><span class="case-toggle">＋</span></summary><div class="case-body"><div><h3>实现方式</h3><p>通过浏览器扩展辅助记录寻访信息，以本地服务和人才库统一保存候选人资料、来源和历史状态；结合关键词、活跃度快照和规则预警，支持后续 Mapping、人才回捞与动态跟进。</p><div class="case-tags"><span class="case-tag">浏览器扩展</span><span class="case-tag">本地人才库</span><span class="case-tag">动态预警</span></div></div><div><h3>核心竞争点</h3><p>把一次性的外部寻访转化为可持续运营的人才资产；既减少重复操作，也让招聘人员能够从公司、岗位和人才流动中逐步形成行业认知。</p></div></div></details>
<details class="case-card"><summary><span class="case-index">02</span><span class="case-heading"><strong>招聘数据分析与漏斗复盘</strong><span>把分散的招聘表格清洗为可追踪的 HR 看板、转化漏斗和复盘数据。</span></span><span class="case-toggle">＋</span></summary><div class="case-body"><div><h3>实现方式</h3><p>批量导入不同来源的招聘表格，完成字段映射、状态归一、去重和异常数据处理；再按招聘经理、渠道、岗位和流程阶段聚合数据，生成趋势、漏斗、渠道贡献及明细下钻。</p><div class="case-tags"><span class="case-tag">数据清洗</span><span class="case-tag">招聘看板</span><span class="case-tag">漏斗分析</span></div></div><div><h3>核心竞争点</h3><p>看板不是单纯展示数字，而是围绕 HR 的实际复盘逻辑组织：定位交付进度、转化损耗、渠道差异和异常节点，帮助招聘人员及时调整策略。</p></div></div></details>
<details class="case-card"><summary><span class="case-index">03</span><span class="case-heading"><strong>人才画像分析与简历筛选</strong><span>面向批量岗位进行初筛，提炼简历关键信息并与岗位画像匹配。</span></span><span class="case-toggle">＋</span></summary><div class="case-body"><div><h3>实现方式</h3><p>通过固定 Skill 将岗位要求转化为统一画像，再结构化提取候选人的经历、能力与项目要点；输出匹配依据、待确认信息和潜在风险，支持批量初步筛选。</p><div class="case-tags"><span class="case-tag">固定 Skill</span><span class="case-tag">岗位画像</span><span class="case-tag">结构化评估</span></div></div><div><h3>核心竞争点</h3><p>不让模型直接替代招聘判断，而是明确展示为什么匹配、哪里存疑、需要进一步确认什么，保证效率提升的同时保留人工校准。</p></div></div></details>
<details class="case-card"><summary><span class="case-index">04</span><span class="case-heading"><strong>招聘流程跟进与异常提醒</strong><span>同步在途候选人的筛选、评估和面试状态，把被动查看变成主动提醒。</span></span><span class="case-toggle">＋</span></summary><div class="case-body"><div><h3>实现方式</h3><p>在合规授权范围内读取招聘系统的只读流程状态，不执行提交或修改等敏感操作；定期识别简历待处理、评估超时、面试异常及跨流程占用状态，并生成协同提醒。</p><div class="case-tags"><span class="case-tag">只读状态同步</span><span class="case-tag">异常检测</span><span class="case-tag">定时提醒</span></div></div><div><h3>核心竞争点</h3><p>把招聘系统里容易遗漏的流程节点转化为清晰的待办和风险提示，降低反复查询成本，也减少候选人因流程停滞而流失。</p></div></div></details>
</div></section>
<section class="section" data-reveal><p class="section-kicker">CAMPUS RECRUITING</p><h2>校招工具实践</h2><div class="case-list"><details class="case-card"><summary><span class="case-index">05</span><span class="case-heading"><strong>面试排期与会议室联动预约</strong><span>解决批量校招面试中，面试官时间、地点、会议室和导入表格无法联动的问题。</span></span><span class="case-toggle">＋</span></summary><div class="case-body"><div><h3>实现方式</h3><p>通过在线问卷收集面试官可用时间、面试地点等信息，结合排期规则与 AI 辅助生成面试安排；自动匹配会议室、校验时间冲突，并输出可导入校招系统的 Excel。</p><div class="case-tags"><span class="case-tag">在线问卷</span><span class="case-tag">自动排期</span><span class="case-tag">Excel 生成</span></div></div><div><h3>核心竞争点</h3><p>不是单点做一张排期表，而是串联信息收集、资源匹配、冲突检查和系统导入，补足简易校招系统在批量面试场景中的能力缺口。</p></div></div></details></div></section>
<section class="section" data-reveal><p class="section-kicker">SIDE PROJECTS</p><h2>工作之外的探索</h2><div class="case-list"><details class="case-card"><summary><span class="case-index">06</span><span class="case-heading"><strong>ESP32 交互硬件精灵</strong><span>把对话模型、记忆与硬件交互结合，探索更有陪伴感的 AI 入口。</span></span><span class="case-toggle">＋</span></summary><div class="case-body"><div><h3>实现方式</h3><p>使用 ESP32 开发板连接屏幕、按键、传感器和音频模块，接入可定制音色的对话能力；结合长期记忆、个人知识库和设备状态，构建能够持续互动的硬件精灵。</p><div class="case-tags"><span class="case-tag">ESP32</span><span class="case-tag">语音对话</span><span class="case-tag">长期记忆</span><span class="case-tag">知识库</span></div></div><div><h3>核心竞争点</h3><p>将软件原型延伸到真实硬件，完整处理交互、声音、设备状态和记忆体验，体现工作之外持续动手验证想法的能力。</p></div></div></details></div></section>
