const PAGES={
resume:{eyebrow:'02 · 个人简历',title:'个人简历',deck:'从互联网平台、电商到游戏与 AI 团队，围绕业务需求持续推进招聘交付、行业研究与效能建设。',content:`
<section class="section" data-reveal><p class="section-kicker">招聘概览</p><h2>招聘能力概览</h2><div class="metric-grid"><div class="metric"><strong>3.5 年</strong><span>招聘工作经验</span></div><div class="metric"><strong>4 类业务</strong><span>互联网平台、文娱内容、游戏与 AI</span></div><div class="metric"><strong>3 类核心能力</strong><span>结果交付、招聘运营、数据分析</span></div></div><button class="resume-download" type="button" data-resume-pending><span><strong>下载完整简历 PDF</strong><small>完整文件补充后，将在这里提供一键下载。</small></span><b>文件待补充 →</b></button><p class="resume-download-status" data-resume-status hidden aria-live="polite">下载入口已经预留；收到 PDF 后即可启用，不会出现空链接。</p></section>
<section class="section" data-reveal><p class="section-kicker">职业履历</p><h2>工作经历</h2><div class="timeline">
<div class="job"><div class="job-time">2026.02—至今</div><div><h3>网易互娱 · 招聘经理</h3><p>负责游戏交互、AI 产品与设计、技术类岗位招聘，参与高阶岗位交付、行业 Mapping、薪酬体系与 AI 应用专项调研，并持续探索招聘提效工具。</p></div></div>
<div class="job"><div class="job-time">2024.12—2026.02</div><div><h3>阿里优酷 · 招聘 HR</h3><p>对接职能、综艺、运营、商业化、内容评估、影视工作室及游戏子公司等 50+ 岗位，自主开源产出 Offer 40+；参与雇主品牌内容与招聘数据运营。</p></div></div>
<div class="job"><div class="job-time">2024.07—2024.11</div><div><h3>拼多多 · HR 管培</h3><p>负责 TEMU 跨境电商业务全流程招聘，覆盖多条核心品类线，推进面试 130+、Offer 30+，并基于招聘漏斗持续优化交付过程。</p></div></div>
<div class="job"><div class="job-time">2023.10—2024.05</div><div><h3>网易雷火 · 美术招聘 HR 实习生</h3><p>服务逆水寒、永劫无间、代号无限大与 3A 单机等项目，负责资深美术及部分技术、策划岗位招聘，产出 P4-1 资深以上 Offer 5 人。</p></div></div>
<div class="job"><div class="job-time">2023.03—2023.09</div><div><h3>快手 · HR 实习生</h3><p>承接主站生产与社交业务线产品、运营、研发、设计岗位需求，任职期间完成社招 Offer 40+、校招 Offer 31、实习生 Offer 54。</p></div></div></div></section>
<section class="section" data-reveal><p class="section-kicker">教育与实践</p><h2>教育与早期实践</h2><div class="copy"><p>北京联合大学国际商务本科，2024 年毕业。在校期间曾担任大学生管理决策模拟大赛与互联网+创新创业大赛队长并获奖。</p><p>大四休学期间在韩国尝试 3C 电子产品及配件采购与分销，累计盈利 10W+。</p></div></section>`},
about:{eyebrow:'01 · 关于我',title:'关于我',deck:'一名互联网招聘从业者，也愿意持续尝试，把想法真正做成可以运行的实践。',content:`
<section class="section" data-reveal><p class="section-kicker">个人简介</p><h2>你好，我是王祥辉</h2><div class="about-intro"><div class="copy about-copy"><p>我于 2024 年本科毕业，目前从事互联网招聘工作，也持续探索 AI 在招聘场景中的实际应用。</p><p>2023 年起，我通过快手和网易雷火的实习进入招聘领域；毕业后在拼多多、阿里优酷和网易互娱从事正式招聘工作，业务覆盖互联网、电商、文娱、游戏与 AI。日常工作以社会招聘为主，既参与高阶及难点岗位交付，也承接基础岗位的批量招聘，接触过产品、运营、研发、设计、美术及 AI 相关岗位。</p></div><figure class="about-portrait"><img src="inner-green-assets/wang-and-cat-720.webp" alt="王祥辉和奶牛猫的 Q 版形象" loading="lazy" decoding="async"></figure></div></section>
<section class="section" data-reveal><p class="section-kicker">招聘理解</p><h2>我如何理解招聘</h2><div class="copy about-copy"><p>我理解的招聘不只是简历开源和流程推进，更重要的是判断岗位为什么招、哪些能力真正影响业务交付、目标人才在哪里，以及各招聘环节可能产生的人才折损。招聘需要在业务需求、人才市场和候选人选择之间持续校准，而不是简单执行一份固定的人才画像。</p><p>实际工作中，我会在招聘启动阶段先与业务明确岗位目标、核心职责、必须项和加分项，再通过人才 Mapping、市场供给、候选人反馈和实际面试结果验证画像是否合理。进入招聘流程后，则结合简历供给、邀约反馈、阶段转化、面试评价、Offer 结果，以及入职后的留存和试用期情况进行信息汇总与问题定位。复盘不只用于判断流程效率，也帮助我持续补充对业务需求、人员判断和人才市场信息的理解，并据此调整寻访范围、沟通重点、渠道投入和流程节奏。</p><p>除社会招聘外，我也参与过校招、暑期实习、线下宣讲、招聘运营及雇主品牌项目。这些经历让我能够从岗位交付、项目推进、数据复盘、招聘协同和候选人体验等不同角度理解招聘工作。</p></div></section>
<section class="section" data-reveal><p class="section-kicker">工具实践</p><h2>招聘与工具</h2><div class="copy about-copy"><p>在实际工作中，流程性招聘、招聘需求盘点、候选人流程跟进和数据复盘等重复性事务，会持续占用招聘时间。因此，我开始尝试将其中规则相对明确、频率较高的环节交由工具辅助处理，把更多精力留给业务沟通、人才判断，以及对部门和人才市场的理解。目前已经实现的工具覆盖自动寻访与活跃度追踪、简历分析、知识问答、批量面试信息收集与安排、招聘流程跟进提醒，以及招聘数据清洗与分析等场景。</p></div></section>
<section class="section" data-reveal><p class="section-kicker">工作之外</p><h2>工作之外</h2><div class="copy about-copy"><p>在校期间，我曾带队参加管理决策模拟和互联网+创新创业比赛并获奖；大四休学期间，也曾在韩国尝试 3C 产品采购与销售。这些经历让我较早接触到团队协作、资源协调和从想法到实际执行的过程，也让我更愿意主动学习和动手验证自己的想法。</p><p>平时我喜欢研究电子产品，也喜欢徒步、骑行和攀岩。希望自己在持续打磨招聘基本功的同时，尽可能拓展研究、数据、沟通和工具实践等方面的能力，并始终保持对新事物的好奇心。</p></div></section>`},
ai:{eyebrow:'03 · AI 与招聘工具',title:'AI 与招聘工具实践',deck:'这些工具来自招聘工作中状态清楚、规则可以定义，并且重复频率较高的环节。我会先梳理实际问题、使用边界和人工判断节点，再通过 Vibe Coding 制作自动化工具、AI 工具或可复用 Skill，跑通最小可用版本并持续调整。',content:`
<section class="section" data-reveal><p class="section-kicker">方法与边界</p><h2>工具如何进入招聘流程</h2><p class="section-intro">工具主要承担信息收集、重复操作、状态跟踪、异常提醒和辅助分析；岗位理解、人才判断、沟通策略及最终决策仍由招聘负责。</p><div class="strength-grid"><div class="strength"><strong>从真实招聘问题出发</strong><span>优先处理状态明确、规则可以定义、重复频率较高且容易遗漏的实际问题。</span></div><div class="strength"><strong>先跑通最小版本</strong><span>先选择一个岗位或一段流程，验证输入、处理、输出和人工复核，再根据实际使用情况持续优化。</span></div><div class="strength"><strong>通过 Vibe Coding 快速实现</strong><span>结合招聘经验制作自动化工具、AI 工具和可复用 Skill，让想法快速进入真实流程验证。</span></div><div class="strength"><strong>保留招聘判断</strong><span>工具负责收集、整理、提醒和辅助分析，不替代岗位画像校准、候选人判断、业务沟通及最终决策。</span></div></div></section>
<section class="section" data-reveal><p class="section-kicker">社会招聘</p><h2>招聘流程与人才运营</h2><p class="section-intro">以下实践覆盖外部寻访、人才库匹配、招聘知识沉淀、简历分析、数据复盘和流程提醒，并根据真实使用反馈持续调整。</p><div class="case-list">
<details class="case-card"><summary><span class="case-index">01</span><span class="case-heading"><strong>人才寻访与运营工作台</strong><span>连接外部招聘平台与公司招聘系统，将自动寻访、候选人信息、人才库记录和活跃状态集中到同一工作台。</span></span><span class="case-toggle">＋</span></summary><div class="case-body"><div><h3>为什么需要这套工作台</h3><p>公司招聘系统能够承接候选人流程，但难以根据个人招聘习惯扩展外部寻访、人才跟踪和动态提醒功能。外部平台上的招呼记录、候选人状态和后续事项相互分散，开展人才 Mapping 或长期人才运营时，需要在多个平台与公司人才库之间反复查询和核对。</p></div><div><h3>目前实现的工作方式</h3><p>通过 Vibe Coding 制作招聘平台辅助寻访工具，在平台规则和账号授权范围内辅助完成外部候选人检索与招呼，并将候选人信息、对应岗位、沟通记录和操作结果同步到工作台。工作台接入公司招聘系统 API，记录候选人时会自动匹配公司人才库中的已有记录，补充历史流程、接触记录和相关信息。工具还会记录活跃状态，针对重点候选人、目标公司和特定人才范围持续观察，在状态变化或达到预设条件时生成预警。</p><div class="case-tags"><span class="case-tag">Vibe Coding</span><span class="case-tag">自动寻访</span><span class="case-tag">招聘系统 API</span><span class="case-tag">人才库匹配</span><span class="case-tag">活跃度预警</span></div></div></div></details>
<details class="case-card"><summary><span class="case-index">02</span><span class="case-heading"><strong>招聘问答与分析助手</strong><span>将个人招聘经验、常见规则和岗位分析方法沉淀为可复用 Skill，辅助完成人才画像、简历分析、风险提示和招聘问题查询。</span></span><span class="case-toggle">＋</span></summary><div class="case-body"><div><h3>将零散经验变成可复用规则</h3><p>招聘工作中存在大量需要重复查询和判断的信息，例如岗位画像如何拆解、简历重点看什么、哪些经历需要继续核实，以及不同流程节点需要注意什么。如果这些内容只依赖个人记忆，不仅查找效率较低，也容易随着岗位数量和工作节奏变化出现口径偏移。</p></div><div><h3>问答、画像与简历分析</h3><p>将常用招聘规则、岗位分析方法、个人工作经验和历史资料整理为个人招聘知识库，并制作问答助手。通过可复用 Skill，将岗位职责、必须项、加分项和潜在风险拆解为相对稳定的维度，再从简历中提取经历摘要、匹配依据、信息缺口、风险提示和后续待核实问题。助手尽量保留回答来源和简历原文依据，缺少信息时明确提示；画像校准、经历判断和最终筛选仍由招聘完成。</p><div class="case-tags"><span class="case-tag">招聘知识库</span><span class="case-tag">个人问答助手</span><span class="case-tag">人才画像</span><span class="case-tag">简历分析</span><span class="case-tag">风险提示</span></div></div></div></details>
<details class="case-card"><summary><span class="case-index">03</span><span class="case-heading"><strong>招聘数据分析与复盘</strong><span>对招聘数据进行清洗、归一和关联分析，形成岗位进展、转化漏斗、流程时长及渠道表现看板。</span></span><span class="case-toggle">＋</span></summary><div class="case-body"><div><h3>复盘需要回答什么</h3><p>招聘复盘不只是统计简历量、面试量和 Offer 数量，还需要判断当前进展是否符合业务预期、问题发生在哪个岗位或流程节点、人才画像是否匹配市场供给，以及渠道投入和流程时长是否合理。</p></div><div><h3>从原始数据到招聘判断</h3><p>工具对不同系统和表格中的数据进行字段映射、状态归一、去重和异常检查，再按照部门、岗位、渠道、招聘负责人和流程阶段生成看板、转化漏斗、时长分析及明细数据。复盘时结合岗位需求、人才供给、面试反馈、Offer、入职及后续情况，辅助定位问题，并补充对业务、人员判断和人才市场的理解。</p><div class="case-tags"><span class="case-tag">数据清洗</span><span class="case-tag">招聘看板</span><span class="case-tag">转化漏斗</span><span class="case-tag">流程时长</span><span class="case-tag">招聘复盘</span></div></div></div></details>
<details class="case-card"><summary><span class="case-index">04</span><span class="case-heading"><strong>招聘流程处理与异常提醒</strong><span>汇总待筛选、待评估、面试异常及重点候选人状态，将分散事项整理为按紧急程度排列的待办。</span></span><span class="case-toggle">＋</span></summary><div class="case-body"><div><h3>让流程异常及时出现</h3><p>招聘系统中的待处理事项分布在不同岗位和流程节点，依赖招聘反复查询，容易出现处理超时、面试异常或重点候选人跟进不及时。</p></div><div><h3>状态同步与跟进提醒</h3><p>工具在合规授权和内部使用边界内读取流程状态，汇总待筛选、待评估、面试异常、长时间未推进及重点候选人情况，并根据事项类型、停留时间和紧急程度生成提醒。工具只进行状态整理、异常识别和待办提示，不自动提交筛选结果、修改评价或执行敏感流程操作。</p><div class="case-tags"><span class="case-tag">流程处理</span><span class="case-tag">状态同步</span><span class="case-tag">异常识别</span><span class="case-tag">超时提醒</span><span class="case-tag">重点候选人</span></div></div></div></details>
</div></section>
<section class="section" data-reveal><p class="section-kicker">校园招聘</p><h2>批量面试协同</h2><p class="section-intro">校招批量面试需要同时协调面试官时间、候选人选择、面试间资源和不同面试轮次。现有招聘系统无法直接完成这套批量排期，也不能与面试间预约联动，人工处理时容易出现时间或资源冲突。</p><div class="case-list"><details class="case-card"><summary><span class="case-index">05</span><span class="case-heading"><strong>校招批量面试信息收集与排期</strong><span>自定义收集内容并发布在线问卷，汇总信息后补充面试间及可用时间，一键生成批量面试安排与系统导入表格。</span></span><span class="case-toggle">＋</span></summary><div class="case-body"><div><h3>自定义并发布在线问卷</h3><p>招聘先根据校招项目自定义需要收集的内容，并上传面试官的可用时间。工具据此生成可通过链接访问的在线问卷，并通过系统邮件向候选人批量发送可选面试时段；候选人只需选择可以参加的时间。</p></div><div><h3>补充资源并一键排期</h3><p>信息收集完成后，招聘补充各城市的面试间及对应可用时间。工具根据面试官、候选人所选时段、城市、轮次和面试间资源进行冲突检查与自动匹配，一键生成面试日程、面试官安排和面试间清单，并输出可以直接上传招聘系统、用于批量安排面试的 Excel 表格。异常冲突和临时调整由招聘最终确认。</p><div class="case-tags"><span class="case-tag">自定义问卷</span><span class="case-tag">在线收集</span><span class="case-tag">冲突检查</span><span class="case-tag">一键排期</span><span class="case-tag">Excel 导入</span></div></div></div></details></div></section>

  const layout=()=>{const width=Math.min(510,vineGame.clientWidth-24);const span=RADIUS*2+1;tileWidth=width/(span+.15);tileHeight=tileWidth*1.1547;const height=tileHeight*(1+RADIUS*1.5);board.style.width=`${width}px`;board.style.height=`${height}px`;links.setAttribute('viewBox',`0 0 ${width} ${height}`);board.style.setProperty('--cat-size',`${tileWidth*1.16}px`);cells.forEach(({button,q,r})=>{const pos=positionOf([q,r]);button.style.left=`${pos.x}px`;button.style.top=`${pos.y}px`;button.style.width=`${tileWidth*.94}px`;button.style.height=`${tileHeight*.94}px`});const catPos=positionOf(catAt);cat.style.left=`${catPos.x}px`;cat.style.top=`${catPos.y}px`;renderLinks()};
  const finish=won=>{done=true;roundWon=won;moving=false;queuedCell?.button.classList.remove('is-pending');queuedCell=null;vineGame.classList.toggle('is-lost',!won);bloom.textContent=won?'🐾':'↟';resultTitle.textContent=won?'围住啦，小猫留下了':'小猫跑掉了';const nextLevel=difficultyLevels[Math.min(difficultyIndex+1,difficultyLevels.length-1)];resultCopy.textContent=won?(difficultyIndex<difficultyLevels.length-1?`完成${difficultyLevels[difficultyIndex].name}档，下一局进入${nextLevel.name}档。`:'藤蔓已经连成围栏，小猫开心地留下来陪你。'):'小猫从森林边缘溜走了，再按当前难度试一次。';again.textContent=won&&difficultyIndex<difficultyLevels.length-1?`进入${nextLevel.name}档`:'再来一局';const reveal=()=>{vineGame.classList.add('is-complete');complete.setAttribute('aria-hidden','false')};if(won){score.textContent=`${difficultyLevels[difficultyIndex].name}档完成 · 小猫正在庆祝`;cells.filter(({q,r})=>blocked.has(keyOf([q,r]))).forEach(({button,q,r},index)=>button.style.setProperty('--win-delay',`${Math.min(.72,distance([q-catAt[0],r-catAt[1]])*.09+index*.012)}s`));vineGame.classList.add('is-winning');setTimeout(reveal,reduced?0:1800)}else setTimeout(reveal,reduced?0:320)};
  const updateCatCell=()=>cells.forEach(({button,q,r})=>button.classList.toggle('is-cat',q===catAt[0]&&r===catAt[1]));
  const reactCat=plantedAt=>{const plantedPos=positionOf(plantedAt);const catPos=positionOf(catAt);cat.style.setProperty('--cat-look',`${Math.max(-8,Math.min(8,(plantedPos.x-catPos.x)*.12))}deg`);cat.classList.remove('is-alert');requestAnimationFrame(()=>cat.classList.add('is-alert'));setTimeout(()=>cat.classList.remove('is-alert'),reduced?0:430)};
  const moveCat=next=>{catAt=next;updateCatCell();const pos=positionOf(catAt);cat.classList.add('is-hopping');cat.style.left=`${pos.x}px`;cat.style.top=`${pos.y}px`;setTimeout(()=>{cat.classList.remove('is-hopping');moving=false;if(isEdge(catAt)){finish(false);return}score.textContent=`已种下 ${planted} 株 · 继续围堵`;const queued=queuedCell;queuedCell=null;if(queued){queued.button.classList.remove('is-pending');plant(queued)}},reduced?0:340)};
  const plant=({button,q,r})=>{const cellKey=keyOf([q,r]);if(done||blocked.has(cellKey)||(q===catAt[0]&&r===catAt[1]))return;if(moving){queuedCell?.button.classList.remove('is-pending');queuedCell={button,q,r};button.classList.add('is-pending');score.textContent='已记录下一步 · 等小猫落地';return}moving=true;blocked.add(cellKey);planted+=1;button.disabled=true;button.classList.remove('is-pending');button.classList.add('is-blocked','is-new');const connected=neighbors([q,r]).filter(pos=>blocked.has(keyOf(pos))).map(pos=>cellMap.get(keyOf(pos)).button);const joining=connected.length?[button,...connected]:[];joining.forEach(item=>item.classList.add('is-joining'));renderLinks(cellKey);reactCat([q,r]);setTimeout(()=>joining.forEach(item=>item.classList.remove('is-joining')),480);setTimeout(()=>button.classList.remove('is-new'),480);const path=shortestPath();if(!path){setTimeout(()=>finish(true),reduced?0:300);return}score.textContent=`已种下 ${planted} 株 · 小猫行动`;setTimeout(()=>moveCat(path[1]),reduced?0:130)};
  const reset=(advance=false)=>{if(advance&&roundWon)difficultyIndex=Math.min(difficultyIndex+1,difficultyLevels.length-1);done=false;roundWon=false;moving=false;queuedCell=null;targetedCell=null;planted=0;catAt=[0,0];blocked=new Set();again.textContent='再来一局';vineGame.classList.remove('is-complete','is-lost','is-winning');complete.setAttribute('aria-hidden','true');score.textContent=`${difficultyLevels[difficultyIndex].name}档 · 选择一格种下藤蔓`;cells.forEach(({button})=>{button.disabled=false;button.classList.remove('is-blocked','is-new','is-cat','is-connected','is-cluster','is-joining','is-pending','is-targeted')});const layouts=difficultyLevels[difficultyIndex].layouts;const layoutChoice=layouts[Math.floor(Math.random()*layouts.length)];layoutChoice.forEach(([q,r])=>{const item=cellMap.get(keyOf([q,r]));blocked.add(keyOf([q,r]));item.button.disabled=true;item.button.classList.add('is-blocked')});updateCatCell();layout()};
  for(let r=-RADIUS;r<=RADIUS;r+=1){const qMin=Math.max(-RADIUS,-r-RADIUS);const qMax=Math.min(RADIUS,-r+RADIUS);let column=0;for(let q=qMin;q<=qMax;q+=1){const button=document.createElement('button');button.type='button';button.className='vine-cell';button.setAttribute('role','gridcell');button.setAttribute('aria-label',`第 ${r+RADIUS+1} 行第 ${column+1} 格，种下藤蔓`);const cell={button,q,r};button.addEventListener('click',()=>plant(cell));board.insertBefore(button,cat);cells.push(cell);cellMap.set(keyOf([q,r]),cell);column+=1}}
  const cellAtPoint=(clientX,clientY)=>{const rect=board.getBoundingClientRect();const point={x:clientX-rect.left,y:clientY-rect.top};let nearest=null;let best=Infinity;cells.forEach(cell=>{const pos=positionOf([cell.q,cell.r]);const gap=Math.hypot(point.x-pos.x,point.y-pos.y);if(gap<best){best=gap;nearest=cell}});return best<=tileWidth*.62?nearest:null};
  const showTarget=cell=>{if(targetedCell===cell)return;targetedCell?.button.classList.remove('is-targeted');targetedCell=cell;if(cell&&!cell.button.disabled&&!cell.button.classList.contains('is-cat'))cell.button.classList.add('is-targeted')};
  board.addEventListener('pointermove',event=>{if(event.pointerType!=='touch')showTarget(cellAtPoint(event.clientX,event.clientY))});board.addEventListener('pointerleave',()=>showTarget(null));board.addEventListener('click',event=>{if(event.detail===0)return;event.preventDefault();event.stopPropagation();const cell=cellAtPoint(event.clientX,event.clientY);if(cell)plant(cell)},true);
  new ResizeObserver(layout).observe(vineGame);document.getElementById('gameReset').addEventListener('click',()=>reset(false));again.addEventListener('click',()=>reset(roundWon));document.getElementById('gameContactButton').addEventListener('click',()=>contactInfo?.scrollIntoView({behavior:reduced?'auto':'smooth',block:'start'}));reset();
  if(new URLSearchParams(location.search).has('game'))requestAnimationFrame(()=>requestAnimationFrame(()=>vineGame.scrollIntoView({behavior:'auto',block:'center'})));
}
